text: "Jeff Leek is the Vice President, Chief Data Officer, and J. Orin Edson Foundation Chair of Biostatistics at the Fred Hutchinson Cancer Center. His work focuses on building tools to help people make sense of massive-scale genomic and biomedical data, with current leadership roles in the Cancer AI Alliance and the Fred Hutch Data Science Lab. Previously a professor at Johns Hopkins Bloomberg School of Public Health, Jeff is a co-founder of the Johns Hopkins Data Science Lab and the popular Simply Statistics blog. He is a recipient of the COPSS Presidents' Award and was named to the Time AI 100 in 2025. https://jtleek.com/"
