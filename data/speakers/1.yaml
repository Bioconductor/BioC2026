text: "Michael Lawrence, Principal Bioinformatics Research Engineer at Freenome, is a researcher in scalable, user-friendly genomic data analysis. With a Ph.D. in Bioinformatics from Iowa State University, he led multiple initiatives at Genentech, including the development of a unified genomic analysis platform. As a core developer of R and a long time contributor to Bioconductor, Michael has helped create a number of packages fundamental to analyzing high-throughput sequencing data and data science in general. https://github.com/lawremi"
name: "Michael Lawrence, Keynote"
position: "Scientific Leader | R Core | Tool Builder | Bridging Bio, Code, and Community"
