text: "Accomplished Director and Principal Scientist with 15+ years of experience leading data science and computational biology initiatives at Fortune 500 biotechnology company. Expert in building scalable analytics platforms, managing cross-functional teams of 20+ engineers and scientists, and driving open-source software adoption. Core developer of the R programming language with 30+ peer-reviewed publications and 25+ open-source packages downloaded 100,000+ times annually. Proven track record of translating complex scientific requirements into enterprise-grade technical solutions. https://github.com/lawremi"
