text: "Ting Ye is an Assistant Professor in Biostatistics at the University of Washington. Her research aims to accelerate human health advances through data-driven discovery, development, and delivery of clinical, medical, and scientific breakthroughs, spanning the design and analysis of complex innovative clinical trials, causal inference in biomedical big data, and quantitative medical research. Ting is a recipient of the School of Public Health's Genentech Endowed Professorship and the NIH Maximizing Investigators' Research Award (MIRA). https://www.biostat.washington.edu/people/ting-ye"
